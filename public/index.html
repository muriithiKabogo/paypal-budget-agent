<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Budget Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="live-status">
            <div class="dot"></div>
            <span>Live - Autonomous cycle every 30s</span>
        </header>

        <main>
            <section class="overview-section">
                <div class="card agent-flow">
                    <h2>Agent Flow</h2>
                    <div class="agent-flow-diagram">
                        <div class="agent-node">
                            <div class="circle buyer">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m12 0V9" /></svg>
                            </div>
                            <span>Budget Agent</span>
                        </div>
                        <div class="flow-connector">
                            <div class="flow-info">
                                <span id="payout-amount">$0.00 Payout</span>
                                <span id="payout-verified">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    Verified on PayPal
                                </span>
                            </div>
                        </div>
                        <div class="agent-node">
                            <div class="circle vendor">
                                 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5A2.25 2.25 0 0115.75 11.25h.75a2.25 2.25 0 012.25 2.25v7.5m-9-7.5h1.5m-1.5 0l-3-4.5m3 4.5l3-4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </div>
                            <span>Vendor Agent</span>
                        </div>
                    </div>
                </div>

                <div class="card budget-gauge">
                    <h2>Budget</h2>
                    <div class="budget-gauge-visual">
                        <div id="budget-ring"></div>
                        <div class="budget-gauge-text">
                            <span id="budget-remaining">$0.00</span>
                            <span id="budget-of-total">of $100.00</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card hero-card">
                <h2>Latest Decision</h2>
                <div id="latest-decision-content">
                    <!-- JS will populate this -->
                    <p>Waiting for first transaction...</p>
                </div>
            </section>

            <section class="card activity-timeline">
                <h2>Recent Activity</h2>
                <ul id="activity-log-list">
                    <!-- JS will populate this -->
                    <li>No activity yet.</li>
                </ul>
            </section>

            <details class="card manual-controls">
                <summary>Manual Controls</summary>
                <div class="manual-controls-content">
                    <div id="manual-transaction">
                        <h3>Manual Transaction</h3>
                        <form id="transaction-form">
                            <input type="text" id="item" placeholder="Item" required>
                            <input type="number" step="0.01" id="amount" placeholder="Amount" required>
                            <button type="submit">Submit Transaction</button>
                        </form>
                        <div id="transaction-status"></div>
                    </div>
                    <div id="budget-reload">
                        <h3>Reload Budget</h3>
                        <form id="budget-form">
                            <input type="number" step="0.01" id="new-budget" placeholder="New Budget" required>
                            <button type="submit">Reload Budget</button>
                        </form>
                        <div id="budget-status"></div>
                    </div>
                </div>
            </details>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
